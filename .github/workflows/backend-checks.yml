name: Project checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  django:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-only-not-for-deployment-use-72-chars-randomized-value-not-real
      DEBUG: "False"
      ALLOW_SQLITE_DATABASE: "True"
      ALLOW_LOCAL_MEDIA_STORAGE: "True"
      SECURE_SSL_REDIRECT: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Check production security settings
        env:
          SECURE_SSL_REDIRECT: "True"
        run: python manage.py check --deploy
${step}      - name: Check model migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run Django tests
        run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=low
      - name: Run frontend tests
        run: npm test
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
