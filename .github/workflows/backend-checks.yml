name: Project checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  django:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-only-not-for-deployment-use-72-chars-randomized-value-not-real
      DEBUG: "False"
      SECURE_SSL_REDIRECT: "False"
      ALLOW_SQLITE_DATABASE: "True"
      ALLOW_LOCAL_MEDIA_STORAGE: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Validate standalone demo launcher
        run: python ../scripts/dev_demo.py --help
      - name: Check production security settings
        env:
          SECURE_SSL_REDIRECT: "True"
        run: python manage.py check --deploy
      - name: Verify production requires persistent services
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          cases = [
              (
                  "ALLOW_SQLITE_DATABASE",
                  "Set DATABASE_URL for production or explicitly allow SQLite.",
              ),
              (
                  "ALLOW_LOCAL_MEDIA_STORAGE",
                  "Configure S3 storage or explicitly allow a persistent local media volume.",
              ),
              (
                  "AWS_STORAGE_BUCKET_NAME",
                  "Set AWS_STORAGE_BUCKET_NAME when USE_S3_STORAGE is enabled.",
              ),
          ]
          for removed, expected in cases:
              env = os.environ.copy()
              env.pop(removed, None)
              if removed == "AWS_STORAGE_BUCKET_NAME":
                  env["USE_S3_STORAGE"] = "True"
              elif removed == "ALLOW_LOCAL_MEDIA_STORAGE":
                  env["ALLOW_SQLITE_DATABASE"] = "True"
              else:
                  env.pop("ALLOW_SQLITE_DATABASE", None)
                  env.pop("DATABASE_URL", None)
              env.pop("AWS_STORAGE_BUCKET_NAME", None)
              result = subprocess.run(
                  [sys.executable, "manage.py", "check"],
                  env=env,
                  capture_output=True,
                  text=True,
              )
              output = result.stdout + result.stderr
              assert result.returncode != 0 and expected in output, (
                  f"Expected production guard for {removed}: {output}"
              )

          env = os.environ.copy()
          env["USE_S3_STORAGE"] = "True"
          env["AWS_STORAGE_BUCKET_NAME"] = "ci-private-bucket"
          result = subprocess.run(
              [sys.executable, "manage.py", "check"],
              env=env,
              capture_output=True,
              text=True,
          )
          assert result.returncode == 0, result.stdout + result.stderr
          PY
      - name: Check model migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run Django tests
        run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=low
      - name: Run frontend tests
        run: npm test
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      LOGIN_THROTTLE_RATE: "120/min"
      SECRET_KEY: ci-only-not-for-deployment-use-72-chars-randomized-value-not-real
      DEBUG: "False"
      SECURE_SSL_REDIRECT: "False"
      ALLOW_SQLITE_DATABASE: "True"
      ALLOW_LOCAL_MEDIA_STORAGE: "True"
      ALLOWED_HOSTS: 127.0.0.1,localhost
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:5173
      FRONTEND_URL: http://127.0.0.1:5173
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Prepare demo database
        working-directory: backend
        env:
          DEBUG: "True"
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
      - name: Start Django API
        working-directory: backend
        run: |
          python manage.py runserver 127.0.0.1:8000 > /tmp/upa-django.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health/; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/upa-django.log
          exit 1
      - name: Install frontend and browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false @playwright/test@1.63.0 axe-core@4.14.0
          npx playwright install --with-deps chromium
      - name: Start Vite
        working-directory: frontend
        env:
          VITE_API_URL: http://127.0.0.1:8000/api
        run: |
          npm run dev -- --host 127.0.0.1 --strictPort > /tmp/upa-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/upa-vite.log
          exit 1
      - name: Run browser smoke tests
        working-directory: frontend
        run: npx playwright test e2e/portal.spec.js
      - name: Show server logs on failure
        if: failure()
        run: |
          cat /tmp/upa-django.log || true
          cat /tmp/upa-vite.log || true

  autonomous-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bootstrap isolated demo with one command
        run: python scripts/dev_demo.py --setup-only
      - name: Verify repeated setup is safe without reinstalling
        run: python scripts/dev_demo.py --setup-only --no-install
      - name: Authenticate each demo role in isolated SQLite
        run: |
          export DEBUG=True ALLOW_SQLITE_DATABASE=True ALLOW_LOCAL_MEDIA_STORAGE=True
          export SQLITE_DB_PATH="$GITHUB_WORKSPACE/backend/.demo.sqlite3"
          export SECRET_KEY="$(cat backend/.demo-secret)"
          cd backend
          .venv/bin/python manage.py shell -c "from django.contrib.auth import authenticate; assert authenticate(username='rodrigo',password='aluno123'); assert authenticate(username='leandro',password='prof123'); assert authenticate(username='admin',password='admin123'); print('Three demo roles authenticated in isolated database')"
