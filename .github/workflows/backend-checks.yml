name: Project checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  django:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: ${{ matrix.database == 'postgresql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: upa_ci
          POSTGRES_PASSWORD: ci-isolated-db-only
          POSTGRES_DB: upa_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U upa_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql://upa_ci:ci-isolated-db-only@localhost:5432/upa_ci?sslmode=disable' || '' }}
      SECRET_KEY: ci-only-not-for-deployment-use-72-chars-randomized-value-not-real
      DEBUG: "False"
      SECURE_SSL_REDIRECT: "False"
      ALLOW_SQLITE_DATABASE: "True"
      ALLOW_LOCAL_MEDIA_STORAGE: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint backend
        run: ruff check .
      - name: Audit backend dependencies
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Check Django configuration
        run: python manage.py check
      - name: Check production security settings
        env:
          SECURE_SSL_REDIRECT: "True"
        run: python manage.py check --deploy --fail-level WARNING
      - name: Verify production requires persistent services
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          cases = [
              (
                  "ALLOW_SQLITE_DATABASE",
                  "Set DATABASE_URL for production or explicitly allow SQLite.",
              ),
              (
                  "ALLOW_LOCAL_MEDIA_STORAGE",
                  "Configure S3 storage or explicitly allow a persistent local media volume.",
              ),
              (
                  "AWS_STORAGE_BUCKET_NAME",
                  "Set AWS_STORAGE_BUCKET_NAME when USE_S3_STORAGE is enabled.",
              ),
          ]
          for removed, expected in cases:
              env = os.environ.copy()
              env.pop(removed, None)
              if removed == "AWS_STORAGE_BUCKET_NAME":
                  env["USE_S3_STORAGE"] = "True"
              elif removed == "ALLOW_LOCAL_MEDIA_STORAGE":
                  env["ALLOW_SQLITE_DATABASE"] = "True"
              else:
                  env.pop("ALLOW_SQLITE_DATABASE", None)
                  env.pop("DATABASE_URL", None)
              env.pop("AWS_STORAGE_BUCKET_NAME", None)
              result = subprocess.run(
                  [sys.executable, "manage.py", "check"],
                  env=env,
                  capture_output=True,
                  text=True,
              )
              output = result.stdout + result.stderr
              assert result.returncode != 0 and expected in output, (
                  f"Expected production guard for {removed}: {output}"
              )

          env = os.environ.copy()
          env["USE_S3_STORAGE"] = "True"
          env["AWS_STORAGE_BUCKET_NAME"] = "ci-private-bucket"
          result = subprocess.run(
              [sys.executable, "manage.py", "check"],
              env=env,
              capture_output=True,
              text=True,
          )
          assert result.returncode == 0, result.stdout + result.stderr
          PY
      - name: Check model migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Validate OpenAPI without warnings
        run: python manage.py spectacular --file /tmp/upa-openapi.yaml --validate --fail-on-warn
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Collect production static assets
        run: python manage.py collectstatic --noinput
      - name: Run Django tests
        run: python manage.py test --noinput

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=low
      - name: Run frontend tests
        run: npm test
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: upa_ci
          POSTGRES_PASSWORD: ci-isolated-db-only
          POSTGRES_DB: upa_e2e
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U upa_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://upa_ci:ci-isolated-db-only@localhost:5432/upa_e2e?sslmode=disable
      DEMO_MODE: "True"
      JWT_REFRESH_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      CSRF_COOKIE_SAMESITE: Lax
      LOGIN_THROTTLE_RATE: 1000/min
      ANON_THROTTLE_RATE: 1000/hour
      EMAIL_FILE_PATH: /tmp/upa-verification-emails
      SECRET_KEY: ci-only-not-for-deployment-use-72-chars-randomized-value-not-real
      DEBUG: "False"
      SECURE_SSL_REDIRECT: "False"
      ALLOW_SQLITE_DATABASE: "True"
      ALLOW_LOCAL_MEDIA_STORAGE: "True"
      ALLOWED_HOSTS: 127.0.0.1,localhost
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:5173
      FRONTEND_URL: http://127.0.0.1:5173
      EMAIL_BACKEND: django.core.mail.backends.filebased.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Prepare demo database
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
          python manage.py collectstatic --noinput
      - name: Start Django API
        working-directory: backend
        run: |
          python manage.py runserver 127.0.0.1:8000 > /tmp/upa-django.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health/ready/; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/upa-django.log
          exit 1
      - name: Install frontend and browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build and serve production frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://127.0.0.1:8000/api
        run: |
          npm run build
          npm run preview -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/upa-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/upa-vite.log
          exit 1
      - name: Run full-stack browser and accessibility tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Show server logs on failure
        if: failure()
        run: |
          cat /tmp/upa-django.log || true
          cat /tmp/upa-vite.log || true
      - name: Store browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
