# Free, standalone Django API on Render. Connect an external persistent
# PostgreSQL (e.g. Neon Free) in DATABASE_URL; secrets are never committed.
services:
  - type: web
    name: takion-campus-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && bash build.sh"
    startCommand: "python manage.py check_academic_integrity && python manage.py migrate --noinput && python manage.py bootstrap_preview && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /health/ready/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: TRUST_PROXY_SSL_HEADER
        value: "True"
      - key: CSRF_COOKIE_SAMESITE
        value: "Lax"
      - key: CAMPUS_ENVIRONMENT
        value: "preview"
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: ACADEMIC_UPLOADS_ENABLED
        value: "False"
      # Free Render disk is ephemeral. Uploads stay disabled until private
      # persistent storage is configured and its free plan is verified.
      - key: ALLOW_LOCAL_MEDIA_STORAGE
        value: "True"
      # Off by default. Enable only after setting three strong private passwords
      # in this service's environment. The command never logs those passwords.
      - key: CAMPUS_PREVIEW_BOOTSTRAP
        value: "False"
      - key: WEB_CONCURRENCY
        value: "1"
